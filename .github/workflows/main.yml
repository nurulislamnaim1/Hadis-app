let langs=store.get('langs',{ar:1,bn:1,en:1}), marks=store.get('marks',{}), cur=null, stack=[];
if(store.get('dark',false)) document.documentElement.dataset.t='dark';

async function load(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function go(fn,title,back=true){stack.push({fn,title});render()}
function render(){const t=stack[stack.length-1];$('#title').textContent=t.title;$('#back').hidden=stack.length<2;$('#langs').hidden=!t.hadith;t.fn()}
$('#back').onclick=()=>{stack.pop();render()};
$('#th').onclick=()=>{const d=document.documentElement.dataset.t!=='dark';document.documentElement.dataset.t=d?'dark':'';store.set('dark',d)};
