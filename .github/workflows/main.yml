function langBar(){
  const el=$('#langs');el.innerHTML='';
  [['ar','العربية'],['bn','বাংলা'],['en','English']].forEach(([k,l])=>{
    const b=document.createElement('button');b.textContent=l;b.className=langs[k]?'on':'';
    b.onclick=()=>{langs[k]=langs[k]?0:1;store.set('langs',langs);langBar();if(window._redraw)window._redraw()};
    el.appendChild(b)});
}

function home(){
  view.innerHTML='';
  COLS.forEach(c=>{const d=document.createElement('div');d.className='card item';
    d.innerHTML=`<div><b>${c.n}</b><br><small>${c.e}</small></div><span>›</span>`;
    d.onclick=()=>go(()=>books(c),c.n);view.appendChild(d)});
}

async function books(c){
  view.innerHTML='<div class="msg">লোড হচ্ছে… Loading…</div>';
  try{
    c.eng=c.eng||await load(BASE+'eng-'+c.id+'.min.json');
    const s=c.eng.metadata.sections, det=c.eng.metadata.section_details||c.eng.metadata.section_detail||{};
    view.innerHTML='<input type="search" id="q" placeholder="ইংরেজিতে সার্চ / Search English text…">';
    const list=document.createElement('div');view.appendChild(list);
    const draw=f=>{list.innerHTML='';
      if(f&&f.length>2){const r=c.eng.hadiths.filter(h=>h.text.toLowe
