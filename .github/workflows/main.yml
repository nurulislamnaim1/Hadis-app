<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b4f">
<title>হাদিস | Hadith</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c1f1d;--mu:#667;--pr:#0f6b4f;--bd:#e2e5df}
:root[data-t=dark]{--bg:#121513;--card:#1c211e;--tx:#e8ece9;--mu:#9aa5a0;--pr:#3ecf9b;--bd:#2c332f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;background:var(--pr);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px}
main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.item small{color:var(--mu)}
input[type=search]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px}
.ar{font-family:Amiri,'Traditional Arabic',serif;font-size:24px;direction:rtl;text-align:right;line-height:2}
.bn{margin-top:6px}.en{margin-top:6px;color:var(--mu);font-family:system-ui,sans-serif;font-size:15px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--pr);margin-bottom:4px}
.meta button{background:none;border:0;font-size:20px;color:var(--pr)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;white-space:nowrap}
.tabs button.on,.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.msg{text-align:center;color:var(--mu);padding:20px}
</style>
</head>
<body>
<header>
  <button id="back" hidden>←</button>
  <h1 id="title">হাদিস | Hadith</h1>
  <button id="bm">★</button>
  <button id="th">🌙</button>
</header>
<main>
  <div id="langs" class="tabs" hidden></div>
  <div id="view"></div>
</main>
<script>
